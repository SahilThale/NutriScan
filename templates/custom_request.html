<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>NutriScan - Custom Request</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background: #8fd694;
            font-family: 'VT323', monospace;
            color: #222;
            margin: 0;
            padding: 0;
        }
        .window {
            background: #f4f4e6;
            border: 3px solid #222;
            border-radius: 12px 12px 8px 8px;
            width: 700px;
            max-width: 98vw;
            margin: 40px auto 0 auto;
            box-shadow: 8px 8px 0 #222;
            position: relative;
        }
        .window-header {
            background: #e0e0d1;
            border-bottom: 2px solid #222;
            border-radius: 10px 10px 0 0;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .window-title {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .window-controls {
            display: flex;
            gap: 0.4rem;
        }
        .window-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #222;
            display: inline-block;
        }
        .window-dot.red { background: #ff5f56; }
        .window-dot.yellow { background: #ffbd2e; }
        .window-dot.green { background: #27c93f; }
        nav {
            background: #d6d6c2;
            border-bottom: 2px solid #222;
            padding: 0.7rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            font-size: 1.3rem;
        }
        nav a, nav span {
            color: #222;
            text-decoration: none;
            margin-right: 1.2rem;
            transition: color 0.2s;
            padding: 2px 8px;
            border-radius: 6px;
        }
        nav a:hover {
            background: #b2b2a3;
            color: #fff;
        }
        nav strong {
            color: #4e7d4e;
            font-size: 1.3em;
            letter-spacing: 2px;
        }
        .content-section {
            padding: 2.2rem 2.2rem 2.2rem 2.2rem;
        }
        h2 {
            font-size: 2rem;
            color: #222;
            margin-bottom: 1.2rem;
            letter-spacing: 2px;
        }
        form {
            background: #e0e0d1;
            border: 2px solid #222;
            border-radius: 10px;
            padding: 1.5rem 1.2rem 1.2rem 1.2rem;
            margin-bottom: 2rem;
            box-shadow: 2px 2px 0 #4e7d4e;
            max-width: 100%;
        }
        form label {
            font-size: 1.1rem;
            color: #222;
            margin-bottom: 0.3rem;
            display: block;
        }
        textarea, input[type="file"] {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            width: 100%;
            margin-bottom: 1.1rem;
            border: 2px solid #222;
            border-radius: 6px;
            padding: 0.5rem;
            background: #fff;
            color: #222;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background: #222;
            color: #fff;
            border: 2px solid #222;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            padding: 0.7rem 2.2rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #4e7d4e;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }
        button[type="submit"]:hover {
            background: #4e7d4e;
            color: #fff;
            transform: translateY(-2px) scale(1.04);
        }
        .result-section {
            background: #e0e0d1;
            border: 2px solid #222;
            border-radius: 10px;
            padding: 1.2rem 1.2rem 1.2rem 1.2rem;
            margin-top: 2rem;
            box-shadow: 2px 2px 0 #4e7d4e;
        }
        .result-section h3 {
            margin-top: 0;
            color: #222;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }
        .result-section p {
            font-size: 1.1rem;
            color: #222;
            margin-bottom: 0.7rem;
        }
        .result-section img {
            border: 2px solid #222;
            border-radius: 8px;
            margin-top: 0.5rem;
            box-shadow: 2px 2px 0 #4e7d4e;
            background: #fff;
        }
        @media (max-width: 800px) {
            .window { width: 99vw; }
            .content-section { padding: 1.2rem 0.5rem 1.2rem 0.5rem; }
            form { max-width: 98vw; }
            nav { flex-direction: column; gap: 0.5rem; }
        }
        footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 1.1rem 0 0.5rem 0;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-radius: 0 0 12px 12px;
            border-top: 2px solid #4e7d4e;
        }
        .footer-dev {
            color: #8fd694;
            font-size: 1rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="window-header">
            <div class="window-controls">
                <span class="window-dot red"></span>
                <span class="window-dot yellow"></span>
                <span class="window-dot green"></span>
            </div>
            <div class="window-title">NutriScan</div>
            <div style="width: 60px;"></div>
        </div>
        <!-- Navbar -->
        <nav>
            <a href="{{ url_for('index') }}"><strong>NutriScan</strong></a>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
        <div class="content-section">
            <h2>Custom Request</h2>
            <form action="{{ url_for('custom_request') }}" method="POST" enctype="multipart/form-data">
                <div>
                    <label for="prompt">Your Question:</label>
                    <textarea name="prompt" id="prompt" rows="5" placeholder="Type your custom request here..." required>{{ prompt or '' }}</textarea>
                </div>
                <div>
                    <label for="image">Optional Image:</label>
                    <input type="file" name="image" id="image" accept="image/*">
                </div>
                <button type="submit">Submit</button>
            </form>
            {% if result %}
                <div class="result-section">
                    <h3>Result:</h3>
                    <p><strong>Prompt:</strong> {{ prompt }}</p>
                    {% if filename %}
                        <p><strong>Image:</strong><br>
                        <img src="{{ url_for('static', filename='uploads/' ~ filename) }}" alt="Uploaded Image" width="250"></p>
                    {% endif %}
                    <p><strong>Response:</strong><br>{{ result }}</p>
                </div>
            {% endif %}
        </div>
        <footer>
            NutriScan &copy; {{ 2024 }}<br>
            <span class="footer-dev">Developed by Vishal Fukat</span>
        </footer>
    </div>
</body>
</html>
